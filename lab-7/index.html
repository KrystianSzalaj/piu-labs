<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prawie Sklep</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; }
        header { background: #222; color: white; padding: 1rem 2rem; }
        h1 { margin: 0; }
        
        .layout {
            display: flex;
            gap: 20px;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
            align-items: flex-start; /* Ważne, żeby koszyk nie rozciągał się na całą wysokość */
        }

        .products-area { flex: 3; }
        .cart-area { flex: 1; position: sticky; top: 20px; }

        @media (max-width: 800px) {
            .layout { flex-direction: column-reverse; }
            .cart-area { position: static; width: 100%; }
        }
    </style>
    <script type="module" src="main.js"></script>
</head>
<body>

    <header>
        <h1>Prawie Sklep</h1>
    </header>

    <div class="layout">
        <div class="products-area">
            <product-list></product-list>
        </div>
        
        <aside class="cart-area">
            <shopping-cart></shopping-cart>
        </aside>
    </div>

</body>
</html>
